<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="30%" stop-color="#F5D77F"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E761E"/>
    </linearGradient>
    <radialGradient id="fav-burgundy" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7A223D"/>
      <stop offset="70%" stop-color="#541427"/>
      <stop offset="100%" stop-color="#380C19"/>
    </radialGradient>
  </defs>

  <!-- Circular Medallion with Gold Rim -->
  <circle cx="60" cy="60" r="56" fill="url(#fav-burgundy)" stroke="url(#fav-gold)" stroke-width="4"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#fav-gold)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.9"/>

  <!-- Stylized Monogram C & Ribbon -->
  <!-- Back Ribbon -->
  <path d="M 44 42 C 48 30, 68 28, 76 36 C 82 42, 80 50, 68 56 C 54 62, 42 70, 48 82 C 54 94, 76 92, 82 80" 
        fill="none" 
        stroke="#F5D77F" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.45"/>

  <!-- Main C Body -->
  <path d="M 76 36.5 C 69 29 55 29 45 37.5 C 33 47.5 33 72.5 45 82.5 C 55 91 69 91 76 83.5 C 78.5 80.5 80 77 82 72.5 C 79 73.5 75.5 74.5 72.5 72 C 67 80 57 82.5 49 76 C 41 69.5 40 50.5 49 44 C 57 37.5 67 40 72.5 48 C 74.5 46 76 41 76 36.5 Z" 
        fill="url(#fav-gold)"/>

  <!-- Center Gift Ribbon Knot -->
  <path d="M 52 54 C 57 51, 67 51, 72 56 C 75 59, 74 64, 69 67 C 62 71, 56 65, 52 61" 
        fill="none" 
        stroke="url(#fav-gold)" 
        stroke-width="3.5" 
        stroke-linecap="round"/>

  <!-- Brilliance Star -->
  <g transform="translate(76, 27)">
    <path d="M 0,-11 Q 0,0 11,0 Q 0,0 0,11 Q 0,0 -11,0 Q 0,0 0,-11 Z" fill="#FFF5C2"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>
</svg>