<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29C"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6B1C"/>
    </linearGradient>
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1814"/>
      <stop offset="100%" stop-color="#0A0907"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Diamond shape -->
  <path d="M 60 5 L 110 35 L 110 85 L 60 115 L 10 85 L 10 35 Z" fill="url(#dark-bg)" stroke="url(#gold-grad)" stroke-width="2"/>
  
  <!-- Inner geometric lines forming a stylized 'C' -->
  <path d="M 85 45 L 60 30 L 35 45 L 35 75 L 60 90 L 85 75" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  
  <!-- Prominent 'C' -->
  <path d="M 75 40 A 30 30 0 1 0 75 80" fill="none" stroke="url(#gold-grad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
        
  <!-- Center gem -->
  <circle cx="60" cy="60" r="6" fill="url(#gold-grad)"/>
</svg>